name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go vet ./...
      - run: go run ./cmd/protocolgen -check
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
        timeout-minutes: 30
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            file: Dockerfile
            target: alisten
          - image: worker
            file: worker.Dockerfile
            target: alisten-worker
          - image: web
            file: web/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ github.ref_type == 'tag' && format('{0}+{1}', github.ref_name, github.sha) || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  helm-release:
    needs: images
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.20.0
      - name: Package release chart
        shell: bash
        run: |
          set -euo pipefail
          chart_version="${GITHUB_REF_NAME#v}"
          app_version="${GITHUB_REF_NAME}+${GITHUB_SHA}"
          chart_dir="${RUNNER_TEMP}/alisten-chart"
          package_dir="${RUNNER_TEMP}/helm-packages"
          mkdir -p "$chart_dir" "$package_dir"
          cp -R helm/alisten/. "$chart_dir/"
          sed -i \
            -e "s/^version: .*/version: ${chart_version}/" \
            -e "s/^appVersion: .*/appVersion: ${app_version}/" \
            "$chart_dir/Chart.yaml"
          sed -i "s|tag: \"\"|tag: \"${chart_version}\"|g" "$chart_dir/values.yaml"
          helm lint "$chart_dir" \
            --set domain=alisten.example \
            --set database.host=postgres \
            --set database.username=alisten \
            --set database.name=alisten \
            --set redis.host=valkey \
            --set storage.endpointUrl=http://rustfs:9000 \
            --set storage.publicUrl=https://s3.example/alisten \
            --set secrets.databasePassword=test \
            --set secrets.storageAccessKeyId=test \
            --set secrets.storageSecretAccessKey=test
          helm template alisten "$chart_dir" \
            --set domain=alisten.example \
            --set database.host=postgres \
            --set database.username=alisten \
            --set database.name=alisten \
            --set redis.host=valkey \
            --set storage.endpointUrl=http://rustfs:9000 \
            --set storage.publicUrl=https://s3.example/alisten \
            --set secrets.databasePassword=test \
            --set secrets.storageAccessKeyId=test \
            --set secrets.storageSecretAccessKey=test \
            >/dev/null
          helm package "$chart_dir" --destination "$package_dir"
      - name: Publish chart to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chart_version="${GITHUB_REF_NAME#v}"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "${RUNNER_TEMP}/helm-packages/alisten-${chart_version}.tgz" "oci://ghcr.io/${repository}/charts"
