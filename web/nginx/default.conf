map $status $log_level {
    ~^5     ERROR;
    default INFO;
}

log_format json escape=json
    '{"time":"$time_iso8601","level":"$log_level","msg":"HTTP 请求",'
    '"service":"alisten","component":"web","version":"@VERSION@",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_seconds":$request_time}';

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout json;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    include /tmp/alisten.d/*.conf;

    location ~ ^/(?:admin|settings|history)?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location ~ ^/r/[^/]+(?:/(?:queue|chat|search|playlists/[^/]+/[^/]+))?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/.+/$ {
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}

server {
    listen 9090;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
