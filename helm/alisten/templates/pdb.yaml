{{- $replicas := ternary .Values.serve.autoscaling.minReplicas .Values.serve.replicas .Values.serve.autoscaling.enabled }}
{{- /* 只有一个副本时，至少保留 1 个可用副本会让节点 drain 永远无法完成。 */}}
{{- if ge (int $replicas) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "alisten.fullname" . }}-serve
  labels:
    {{- include "alisten.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "alisten.selectorLabels" (dict "root" . "component" "serve") | nindent 6 }}
{{- end }}
