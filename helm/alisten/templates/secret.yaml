{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alisten.fullname" . }}
  labels:
    {{- include "alisten.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ required "secrets.databasePassword 不能为空，或者设置 existingSecret" .Values.secrets.databasePassword | quote }}
  STORAGE_ACCESS_KEY_ID: {{ required "secrets.storageAccessKeyId 不能为空，或者设置 existingSecret" .Values.secrets.storageAccessKeyId | quote }}
  STORAGE_SECRET_ACCESS_KEY: {{ required "secrets.storageSecretAccessKey 不能为空，或者设置 existingSecret" .Values.secrets.storageSecretAccessKey | quote }}
  {{- with .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminToken }}
  ALISTEN_ADMIN_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
