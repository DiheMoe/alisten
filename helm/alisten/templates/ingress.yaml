{{- if .Values.ingress.enabled }}
{{- $fullname := include "alisten.fullname" . }}
{{- $host := include "alisten.domain" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "alisten.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-serve
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-serve
                port:
                  name: http
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-serve
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port:
                  name: http
{{- end }}
