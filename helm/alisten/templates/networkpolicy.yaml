{{- if .Values.networkPolicy.enabled }}
{{- $v4 := list }}
{{- $v6 := list }}
{{- range .Values.networkPolicy.privateCIDRs }}
{{- if contains ":" . }}
{{- $v6 = append $v6 . }}
{{- else }}
{{- $v4 = append $v4 . }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "alisten.fullname" . }}-worker
  labels:
    {{- include "alisten.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "alisten.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $v4 | nindent 14 }}
        - ipBlock:
            cidr: ::/0
            except:
              {{- toYaml $v6 | nindent 14 }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
